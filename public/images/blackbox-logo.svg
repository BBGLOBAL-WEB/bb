<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#1a1a1a"/>
  
  <!-- BLACK text with 3D effect -->
  <g>
    <!-- Shadow/3D effect -->
    <text x="52" y="120" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#333333" letter-spacing="8">BLACK</text>
    <!-- Main text -->
    <text x="50" y="118" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" letter-spacing="8">BLACK</text>
  </g>
  
  <!-- BOX text with 3D effect -->
  <g>
    <!-- Shadow/3D effect -->
    <text x="52" y="180" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#333333" letter-spacing="8">BOX</text>
    <!-- Main text -->
    <text x="50" y="178" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" letter-spacing="8">BOX</text>
  </g>
</svg>