<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Drone illustration -->
  <g transform="translate(200, 100)">
    <!-- Center body -->
    <ellipse cx="0" cy="0" rx="25" ry="35" fill="#e8e8e8"/>
    <circle cx="0" cy="-15" r="18" fill="#e8e8e8"/>
    
    <!-- Camera/gimbal -->
    <rect x="-8" y="15" width="16" height="12" fill="#d0d0d0" rx="2"/>
    
    <!-- Left arms -->
    <line x1="-25" y1="-10" x2="-70" y2="-25" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
    <line x1="-25" y1="10" x2="-70" y2="25" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right arms -->
    <line x1="25" y1="-10" x2="70" y2="-25" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="10" x2="70" y2="25" stroke="#e8e8e8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left propellers -->
    <g transform="translate(-70, -25)">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#e8e8e8" stroke-width="3" transform="rotate(45)"/>
    </g>
    <g transform="translate(-70, 25)">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#e8e8e8" stroke-width="3" transform="rotate(45)"/>
    </g>
    
    <!-- Right propellers -->
    <g transform="translate(70, -25)">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#e8e8e8" stroke-width="3" transform="rotate(45)"/>
    </g>
    <g transform="translate(70, 25)">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#e8e8e8" stroke-width="3" transform="rotate(45)"/>
    </g>
  </g>
  
  <!-- DJI text -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">dji</text>
</svg>